services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - db_data:/app/instance
    expose:
      - "5000"
    environment:
      - PORT=5000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  db_data:
